name: AutoFilter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    name: Python syntax and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Check required project files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ["bot.py", "info.py", "requirements.txt", "Procfile"]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit("Missing required project files: " + ", ".join(missing))
          print("Required project files are present.")
          PY
